# Cấu hình riêng từng máy nằm trong application-local.properties (không đẩy lên Git)
spring.config.import=optional:file:./application-local.properties
# App desktop: không chạy web server (không còn cổng 8080)
spring.main.web-application-type=none
spring.main.banner-mode=off

# SỬA Ở ĐÂY nếu SQL Server của bạn khác (tên server, user, mật khẩu)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HighlandsDB;encrypt=true;trustServerCertificate=true;loginTimeout=5
spring.datasource.username=sa
   spring.datasource.password=DOI_MAT_KHAU_O_application-local.properties
# SQL Server tắt thì báo lỗi sau 5 giây, không treo lâu
spring.datasource.hikari.connection-timeout=5000

# update: tự tạo bảng nếu chưa có (đã chạy sql/script.sql thì vẫn dùng được)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=WARN
